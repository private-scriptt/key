name: Decompile APK to Source Project

on:
  workflow_dispatch:
    inputs:
      output_name:
        description: 'Nama output source project'
        required: true
        default: 'Decompiled-App'

env:
  OUTPUT_NAME: ${{ github.event.inputs.output_name || 'Decompiled-App' }}

jobs:
  decompile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate uploaded APK
        run: |
          set -euo pipefail
          test -f uploads/latest_source.apk || {
            echo 'uploads/latest_source.apk tidak ditemukan.'
            exit 1
          }
          file uploads/latest_source.apk
          unzip -t uploads/latest_source.apk >/dev/null
          unzip -l uploads/latest_source.apk | grep -q 'AndroidManifest.xml' || {
            echo 'AndroidManifest.xml tidak ditemukan.'
            exit 1
          }

      - name: Download official JADX and Apktool
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y jq unzip zip file
          mkdir -p /opt/jadx /opt/apktool

          JADX_URL=$(curl -fsSL https://api.github.com/repos/skylot/jadx/releases/latest \
            | jq -r '.assets[] | select(.name | test("^jadx-[0-9].*\\.zip$")) | .browser_download_url' \
            | head -n 1)
          test -n "$JADX_URL" && test "$JADX_URL" != null
          curl -fL "$JADX_URL" -o /tmp/jadx.zip
          unzip -q /tmp/jadx.zip -d /opt/jadx
          chmod +x /opt/jadx/bin/jadx

          APKTOOL_URL=$(curl -fsSL https://api.github.com/repos/iBotPeaches/Apktool/releases/latest \
            | jq -r '.assets[] | select(.name | test("^apktool_.*\\.jar$")) | .browser_download_url' \
            | head -n 1)
          test -n "$APKTOOL_URL" && test "$APKTOOL_URL" != null
          curl -fL "$APKTOOL_URL" -o /opt/apktool/apktool.jar

          /opt/jadx/bin/jadx --version
          java -jar /opt/apktool/apktool.jar --version

      - name: Decompile APK with JADX and Apktool
        run: |
          set -u
          rm -rf work dist
          mkdir -p work/jadx work/apktool work/logs dist

          set +e
          JAVA_OPTS='-Xmx4G' /opt/jadx/bin/jadx \
            -j 2 \
            --show-bad-code \
            -d work/jadx \
            uploads/latest_source.apk \
            >work/logs/jadx.log 2>&1
          JADX_EXIT=$?

          java -Xmx4G -jar /opt/apktool/apktool.jar decode \
            --force \
            --output work/apktool \
            uploads/latest_source.apk \
            >work/logs/apktool.log 2>&1
          APKTOOL_EXIT=$?
          set -e

          echo "$JADX_EXIT" > work/logs/jadx-exit-code.txt
          echo "$APKTOOL_EXIT" > work/logs/apktool-exit-code.txt
          echo "JADX exit code: $JADX_EXIT"
          echo "Apktool exit code: $APKTOOL_EXIT"

          test -d work/jadx || mkdir -p work/jadx
          test -d work/apktool || mkdir -p work/apktool

      - name: Assemble reconstructed Android project
        run: |
          set -euo pipefail
          SAFE_NAME=$(printf '%s' "$OUTPUT_NAME" \
            | tr ' ' '-' \
            | tr -cd '[:alnum:]_.-' \
            | cut -c1-60)
          test -n "$SAFE_NAME" || SAFE_NAME='Decompiled-App'
          ROOT="dist/${SAFE_NAME}-source"
          PROJECT="$ROOT/android-studio-project"

          mkdir -p \
            "$PROJECT/app/src/main/java" \
            "$PROJECT/app/src/main/res" \
            "$ROOT/jadx-output" \
            "$ROOT/apktool-project" \
            "$ROOT/decompile-logs"

          if [ -d work/jadx/sources ]; then
            cp -a work/jadx/sources/. "$PROJECT/app/src/main/java/"
          fi

          MANIFEST=''
          if [ -f work/apktool/AndroidManifest.xml ]; then
            MANIFEST='work/apktool/AndroidManifest.xml'
          elif [ -f work/jadx/resources/AndroidManifest.xml ]; then
            MANIFEST='work/jadx/resources/AndroidManifest.xml'
          fi
          if [ -n "$MANIFEST" ]; then
            cp "$MANIFEST" "$PROJECT/app/src/main/AndroidManifest.xml"
          else
            cat > "$PROJECT/app/src/main/AndroidManifest.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.decompiled.app">
              <application android:label="Decompiled App" />
          </manifest>
          EOF
          fi

          if [ -d work/apktool/res ]; then
            rm -rf "$PROJECT/app/src/main/res"
            cp -a work/apktool/res "$PROJECT/app/src/main/res"
          elif [ -d work/jadx/resources/res ]; then
            rm -rf "$PROJECT/app/src/main/res"
            cp -a work/jadx/resources/res "$PROJECT/app/src/main/res"
          fi
          [ -d work/apktool/assets ] && cp -a work/apktool/assets "$PROJECT/app/src/main/assets"
          [ -d work/apktool/lib ] && cp -a work/apktool/lib "$PROJECT/app/src/main/jniLibs"
          [ -d work/apktool/unknown ] && cp -a work/apktool/unknown "$PROJECT/app/src/main/unknown"

          cp -a work/jadx/. "$ROOT/jadx-output/" || true
          cp -a work/apktool/. "$ROOT/apktool-project/" || true
          cp -a work/logs/. "$ROOT/decompile-logs/" || true

          export ROOT PROJECT SAFE_NAME
          python3 - <<'PY'
          import hashlib
          import os
          import re
          from pathlib import Path

          root = Path(os.environ['ROOT'])
          project = Path(os.environ['PROJECT'])
          safe_name = os.environ['SAFE_NAME']
          manifest_path = project / 'app/src/main/AndroidManifest.xml'
          manifest = manifest_path.read_text(encoding='utf-8', errors='ignore')
          package_match = re.search(r'\bpackage\s*=\s*["\']([^"\']+)["\']', manifest)
          package_name = package_match.group(1).strip() if package_match else 'com.decompiled.app'
          if not re.fullmatch(r'[A-Za-z_][\w]*(?:\.[A-Za-z_][\w]*)+', package_name):
              package_name = 'com.decompiled.app'

          apktool_yml = Path('work/apktool/apktool.yml')
          yml = apktool_yml.read_text(encoding='utf-8', errors='ignore') if apktool_yml.exists() else ''

          def yml_value(key, default):
              match = re.search(rf'^\s*{re.escape(key)}:\s*["\']?([^\n"\']+)', yml, re.M)
              return match.group(1).strip() if match else default

          def positive_int(value, default):
              match = re.search(r'\d+', str(value))
              return int(match.group(0)) if match else default

          min_sdk = positive_int(yml_value('minSdkVersion', '21'), 21)
          target_sdk = positive_int(yml_value('targetSdkVersion', '35'), 35)
          version_code = positive_int(yml_value('versionCode', '1'), 1)
          version_name = yml_value('versionName', '1.0').replace("'", '')[:50] or '1.0'
          compile_sdk = max(35, min(target_sdk, 36))

          (project / 'settings.gradle').write_text(
              "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }\n"
              "dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }\n"
              f"rootProject.name = '{safe_name}'\n"
              "include ':app'\n",
              encoding='utf-8'
          )
          (project / 'build.gradle').write_text(
              "plugins {\n"
              "    id 'com.android.application' version '8.7.3' apply false\n"
              "}\n",
              encoding='utf-8'
          )
          (project / 'gradle.properties').write_text(
              "org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8\n"
              "android.useAndroidX=true\n"
              "android.nonTransitiveRClass=false\n",
              encoding='utf-8'
          )
          (project / 'app/build.gradle').write_text(f"""plugins {{
              id 'com.android.application'
          }}

          android {{
              namespace '{package_name}'
              compileSdk {compile_sdk}

              defaultConfig {{
                  applicationId '{package_name}'
                  minSdk {min_sdk}
                  targetSdk {target_sdk}
                  versionCode {version_code}
                  versionName '{version_name}'
              }}

              sourceSets {{
                  main.java.srcDirs = ['src/main/java']
                  main.jniLibs.srcDirs = ['src/main/jniLibs']
              }}

              buildTypes {{
                  release {{
                      minifyEnabled false
                  }}
                  debug {{
                      debuggable true
                  }}
              }}

              compileOptions {{
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }}
          }}

          dependencies {{
              // Dependency asli tidak tersimpan lengkap di APK.
              // Tambahkan library yang diperlukan berdasarkan error import.
          }}
          """, encoding='utf-8')

          apk = Path('uploads/latest_source.apk')
          sha256 = hashlib.sha256(apk.read_bytes()).hexdigest()
          java_files = sum(1 for _ in (project / 'app/src/main/java').rglob('*.java'))
          smali_files = sum(1 for _ in Path('work/apktool').glob('smali*/**/*.smali'))
          resource_files = sum(1 for p in (project / 'app/src/main/res').rglob('*') if p.is_file())

          readme = f"""# {safe_name} — Source Hasil Rekonstruksi

          Paket aplikasi terdeteksi: `{package_name}`

          ## Isi folder

          - `android-studio-project/`: struktur proyek yang dapat dibuka dan diedit.
          - `jadx-output/`: Java source dan resource hasil JADX.
          - `apktool-project/`: manifest, resource, aset, library native, dan smali hasil Apktool.
          - `decompile-logs/`: log dan kode keluar alat dekompilasi.

          ## Statistik

          - Java files: {java_files}
          - Smali files: {smali_files}
          - Resource files: {resource_files}
          - SHA-256 APK: `{sha256}`

          ## Batasan penting

          Ini bukan source asli 100%. APK adalah hasil kompilasi, sehingga komentar, nama variabel tertentu,
          file Gradle asli, dependency, signing key, source Kotlin asli, dan bagian yang di-obfuscate tidak dapat
          dipulihkan secara sempurna. Proyek Android Studio dapat memerlukan perbaikan import/dependency sebelum build.
          """
          (root / 'README.md').write_text('\n'.join(line.strip() for line in readme.splitlines()) + '\n', encoding='utf-8')
          (root / 'DECOMPILE_INFO.txt').write_text(
              f'output_name={safe_name}\npackage={package_name}\nmin_sdk={min_sdk}\n'
              f'target_sdk={target_sdk}\nversion_code={version_code}\nversion_name={version_name}\n'
              f'apk_sha256={sha256}\n',
              encoding='utf-8'
          )
          PY

          (
            cd dist
            zip -9 -r "${SAFE_NAME}-source.zip" "${SAFE_NAME}-source"
          )
          ls -lh "dist/${SAFE_NAME}-source.zip"
          echo "SOURCE_ZIP=dist/${SAFE_NAME}-source.zip" >> "$GITHUB_ENV"

      - name: Upload reconstructed source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: reconstructed-source-${{ github.run_id }}
          path: dist/*-source.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
