

name: Build Sync XxX APK

on:
  workflow_dispatch:
    inputs:
      apk_name:
        description: "Nama APK"
        required: true
        default: "SyncXxX"
        type: string

      build_type:
        description: "Jenis build"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - debug

permissions:
  contents: read
  actions: write

env:
  APK_NAME: ${{ github.event.inputs.apk_name || 'SyncXxX' }}
  BUILD_TYPE: ${{ github.event.inputs.build_type || 'release' }}

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Periksa ZIP
      - name: Detect Uploaded ZIP
        shell: bash
        run: |
          set -e

          if [ ! -f "uploads/latest_project.zip" ]; then
            echo "❌ uploads/latest_project.zip tidak ditemukan!"
            exit 1
          fi

          echo "✅ ZIP ditemukan."
          ls -lh uploads/latest_project.zip

      # 3. Ekstrak ZIP dan cari seluruh file
      - name: Extract User Project ZIP
        shell: bash
        run: |
          set -e

          ZIP="uploads/latest_project.zip"
          TEMP="extracted_temp"

          rm -rf "$TEMP" android
          mkdir -p "$TEMP"

          echo "📦 Mengekstrak ZIP..."
          unzip -q "$ZIP" -d "$TEMP"

          echo "🔍 Mencari generate_icons.py..."
          GENERATOR=$(find "$TEMP" -type f -name "generate_icons.py" -print -quit)

          if [ -z "$GENERATOR" ]; then
            echo "❌ generate_icons.py tidak ditemukan di dalam ZIP!"
            find "$TEMP" -maxdepth 5 -type f | head -200
            exit 1
          fi

          cp "$GENERATOR" ./generate_icons.py
          echo "✅ Generator ditemukan: $GENERATOR"

          echo "🖼️ Menyalin gambar JPG/JPEG..."
          find "$TEMP" -type f \
            \( -iname "*.jpg" -o -iname "*.jpeg" \) \
            -exec cp -f {} ./ \;

          echo "🔍 Mencari Gradle project..."
          GRADLE_FILE=$(find "$TEMP" -type f -name "gradlew" -print -quit)

          if [ -z "$GRADLE_FILE" ]; then
            echo "❌ gradlew tidak ditemukan!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLE_FILE")

          mkdir -p android
          cp -a "$PROJECT_DIR"/. android/

          chmod +x android/gradlew

          echo "📋 File generator:"
          ls -lh generate_icons.py

          echo "📋 Gambar yang ditemukan:"
          find . -maxdepth 1 -type f \
            \( -iname "*.jpg" -o -iname "*.jpeg" \) -print

          echo "✅ Ekstraksi selesai."

      # 4. Pastikan Gradle wrapper tersedia
      - name: Fix Gradle Wrapper
        shell: bash
        run: |
          set -e

          cd android

          if [ ! -f "gradlew" ]; then
            echo "❌ gradlew tidak ditemukan!"
            exit 1
          fi

          chmod +x gradlew

          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "⚠️ Gradle wrapper JAR tidak ditemukan."
            echo "Mencoba menggunakan Gradle sistem..."

            if ! command -v gradle >/dev/null 2>&1; then
              echo "❌ Gradle tidak tersedia."
              exit 1
            fi
          fi

          echo "✅ Gradle wrapper diperiksa."

      # 5. Verifikasi project Android
      - name: Verify Android Project
        shell: bash
        run: |
          set -e

          cd android

          if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
            echo "❌ settings.gradle tidak ditemukan!"
            exit 1
          fi

          if [ ! -d "app" ]; then
            echo "❌ Folder app tidak ditemukan!"
            exit 1
          fi

          echo "✅ Struktur project Android valid."

      # 6. Setup Java
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # 7. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 8. Install Pillow
      - name: Install Pillow
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install Pillow

      # 9. Generate icons
      - name: Generate App Icons
        shell: bash
        run: |
          set -e

          RES="android/app/src/main/res"

          echo "🧹 Membersihkan adaptive icon XML..."

          if [ -d "$RES" ]; then
            find "$RES" -type f \
              \( -name "ic_launcher.xml" -o -name "ic_launcher_round.xml" \) \
              -delete
          fi

          echo "📁 Memeriksa generator..."

          if [ ! -f "generate_icons.py" ]; then
            echo "❌ generate_icons.py tidak ditemukan!"
            exit 1
          fi

          echo "🔍 Memeriksa gambar..."

          REQUIRED_IMAGES=(
            sync.jpg
            whatsapp.jpg
            youtube.jpg
            instagram.jpg
            telegram.jpg
            xnxx.jpg
            spoty.jpg
            melolo.jpg
            canva.jpg
            capcut.jpg
            facebook.jpg
            shopee.jpg
            line.jpg
            alibaba.jpg
            tokopedia.jpg
            grab.jpg
            wps.jpg
            wechat.jpg
            ml.jpg
            ff.jpg
            mechat.jpg
            omi.jpg
            snackvideo.jpg
            messages.jpg
            dana.jpg
            bcaimobile.jpg
            livin.jpg
            gopay.jpg
            brimo.jpg
            photos.jpg
            seabank.jpg
            gmail.jpg
          )

          MISSING=0

          for FILE in "${REQUIRED_IMAGES[@]}"; do
            if [ ! -f "$FILE" ]; then
              echo "❌ Gambar tidak ditemukan: $FILE"
              MISSING=$((MISSING + 1))
            fi
          done

          if [ "$MISSING" -gt 0 ]; then
            echo "❌ Ada $MISSING gambar yang belum ditemukan."
            exit 1
          fi

          echo "✅ Semua gambar ditemukan."

          echo "🎨 Menjalankan generator..."
          python3 generate_icons.py

          echo "🔍 Memverifikasi hasil ikon..."

          DENSITIES=(
            mdpi
            hdpi
            xhdpi
            xxhdpi
            xxxhdpi
          )

          for DENSITY in "${DENSITIES[@]}"; do
            DIR="$RES/mipmap-$DENSITY"

            if [ ! -d "$DIR" ]; then
              echo "❌ Folder tidak ditemukan: $DIR"
              exit 1
            fi

            COUNT=$(find "$DIR" -maxdepth 1 -type f -name "*.png" | wc -l)

            if [ "$COUNT" -lt 33 ]; then
              echo "❌ Ikon kurang di $DIR: $COUNT/33"
              exit 1
            fi

            echo "✅ $DENSITY: $COUNT ikon"
          done

          echo "✅ Semua ikon berhasil dibuat"

      # 10. Build APK
      - name: Build APK
        shell: bash
        run: |
          set -e

          cd android

          echo "🔨 Memulai build $BUILD_TYPE..."

          if [ "$BUILD_TYPE" = "debug" ]; then
            ./gradlew assembleDebug --no-daemon
          else
            ./gradlew assembleRelease --no-daemon
          fi

      # 11. Siapkan hasil APK
      - name: Prepare APK
        shell: bash
        run: |
          set -e

          mkdir -p output

          if [ "$BUILD_TYPE" = "debug" ]; then
            APK=$(find android/app/build/outputs/apk/debug \
              -type f -name "*.apk" -print -quit)
          else
            APK=$(find android/app/build/outputs/apk/release \
              -type f -name "*.apk" -print -quit)
          fi

          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "❌ APK hasil build tidak ditemukan!"
            exit 1
          fi

          cp "$APK" "output/${APK_NAME}.apk"

          echo "✅ APK berhasil disiapkan."
          ls -lh "output/${APK_NAME}.apk"

      # 12. Upload artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}-${{ env.BUILD_TYPE }}
          path: output/${{ env.APK_NAME }}.apk
          if-no-files-found: error
          retention-days: 7

      # 13. Build selesai
      - name: Build Summary
        if: success()
        shell: bash
        run: |
          echo "================================"
          echo "       BUILD BERHASIL"
          echo "================================"
          echo "APK: ${APK_NAME}.apk"
          echo "Type: ${BUILD_TYPE}"
          echo "File: output/${APK_NAME}.apk"
          echo "================================"
