
name: Build Sync XxX APK

on:
  workflow_dispatch:
    inputs:
      apk_name:
        description: 'Nama APK Output'
        required: true
        default: 'SyncXxX'
        type: string
      build_type:
        description: 'Tipe Build'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

env:
  APK_NAME: ${{ inputs.apk_name || 'SyncXxX' }}
  BUILD_TYPE: ${{ inputs.build_type || 'debug' }}
  ZIP_PATH: uploads/latest_project.zip

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read

    defaults:
      run:
        shell: bash

    steps:

      # ==========================================
      # 1. CHECKOUT REPOSITORY
      # ==========================================

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false

      - name: Download Git LFS Files
        run: |
          set -euo pipefail

          git lfs install --local
          git lfs pull

          echo "Git LFS completed"

      - name: Show Build Configuration
        run: |
          echo "APK Name: $APK_NAME"
          echo "Build Type: $BUILD_TYPE"
          echo "Repository: $GITHUB_REPOSITORY"

      # ==========================================
      # 2. CHECK AND VALIDATE ZIP
      # ==========================================

      - name: Check Project ZIP
        id: check_zip
        run: |
          if [ -f "$ZIP_PATH" ]; then
            echo "zip_found=true" >> "$GITHUB_OUTPUT"
            echo "Project ZIP found"
          else
            echo "zip_found=false" >> "$GITHUB_OUTPUT"
            echo "Using existing android directory"
          fi

      - name: Validate ZIP Integrity
        if: steps.check_zip.outputs.zip_found == 'true'
        run: |
          set -euo pipefail

          echo "Checking ZIP file"

          ls -lh "$ZIP_PATH"
          file "$ZIP_PATH"

          if head -c 200 "$ZIP_PATH" | \
             grep -a -q 'git-lfs.github.com/spec/v1'; then
            echo "::error::Git LFS pointer detected"
            exit 1
          fi

          if ! unzip -tq "$ZIP_PATH"; then
            echo "::error::ZIP archive is invalid"
            exit 1
          fi

          echo "ZIP validation successful"

      # ==========================================
      # 3. EXTRACT ANDROID PROJECT
      # ==========================================

      - name: Extract Project ZIP
        if: steps.check_zip.outputs.zip_found == 'true'
        run: |
          set -euo pipefail

          echo "Extracting Android project"

          rm -rf extracted_temp
          mkdir -p extracted_temp

          unzip -q "$ZIP_PATH" -d extracted_temp

          echo "Extracted files:"
          ls -lah extracted_temp

          GRADLEW_PATH=$(find extracted_temp \
            -type f \
            -name gradlew \
            -print -quit)

          if [ -z "$GRADLEW_PATH" ]; then
            echo "::error::gradlew not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW_PATH")

          echo "Project directory: $PROJECT_DIR"

          # Copy top-level auxiliary files.
          if [ "$PROJECT_DIR" != "extracted_temp" ]; then
            find extracted_temp \
              -maxdepth 1 \
              -type f \
              -exec cp {} ./ \;
          fi

          rm -rf android
          mkdir -p android

          cp -a "$PROJECT_DIR"/. android/

          rm -rf extracted_temp

          echo "Android project ready"
          ls -lah android

      # ==========================================
      # 4. VERIFY PROJECT
      # ==========================================

      - name: Verify Android Project
        run: |
          set -euo pipefail

          test -f android/gradlew || {
            echo "::error::Gradle wrapper missing"
            exit 1
          }

          if [ ! -f android/settings.gradle ] && \
             [ ! -f android/settings.gradle.kts ]; then
            echo "::error::Gradle settings missing"
            exit 1
          fi

          test -d android/app || {
            echo "::error::Android app module missing"
            exit 1
          }

          chmod +x android/gradlew

          echo "Android project verified"

      # ==========================================
      # 5. JAVA SETUP
      # ==========================================

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ==========================================
      # 6. ANDROID SDK SETUP
      # ==========================================

      - name: Configure Android SDK
        run: |
          set -euo pipefail

          echo "Configuring Android SDK"

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK_ROOT" ]; then
            echo "::error::Android SDK not found"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          echo "$SDK_ROOT/cmdline-tools/latest/bin" \
            >> "$GITHUB_PATH"

          echo "$SDK_ROOT/platform-tools" \
            >> "$GITHUB_PATH"

          echo "Android SDK: $SDK_ROOT"

      - name: Accept Android SDK Licenses
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME" \
              -type f \
              -name sdkmanager \
              -print -quit)
          fi

          if [ -z "$SDKMANAGER" ] || \
             [ ! -f "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found"
            exit 1
          fi

          echo "Accepting Android SDK licenses"

          yes | "$SDKMANAGER" --licenses \
            > /tmp/android-licenses.log 2>&1 || {
              STATUS=$?
              if [ "$STATUS" -ne 141 ]; then
                tail -50 /tmp/android-licenses.log
                exit "$STATUS"
              fi
            }

          tail -10 /tmp/android-licenses.log

          echo "Android SDK license step finished"

      - name: Install Android SDK Components
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME" \
              -type f \
              -name sdkmanager \
              -print -quit)
          fi

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK components installed"

      # ==========================================
      # 7. GRADLE WRAPPER
      # ==========================================

      - name: Verify Gradle Wrapper
        working-directory: android
        run: |
          set -euo pipefail

          chmod +x gradlew

          if [ ! -f gradle/wrapper/gradle-wrapper.properties ]; then
            echo "::error::Gradle wrapper properties missing"
            exit 1
          fi

          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Gradle wrapper JAR missing"

            GRADLE_VERSION=8.4

            curl -fL --retry 3 \
              -o /tmp/gradle.zip \
              "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"

            unzip -q /tmp/gradle.zip -d /tmp

            /tmp/gradle-${GRADLE_VERSION}/bin/gradle \
              wrapper \
              --gradle-version "$GRADLE_VERSION"

            rm -rf \
              /tmp/gradle.zip \
              "/tmp/gradle-${GRADLE_VERSION}"
          fi

          chmod +x gradlew

          echo "Gradle wrapper ready"

      # ==========================================
      # 8. PYTHON SETUP
      # ==========================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow
        run: |
          python -m pip install Pillow

      # ==========================================
      # 9. GENERATE ICONS
      # ==========================================

      - name: Generate App Icons
        run: |
          set -euo pipefail

          RES="android/app/src/main/res"

          mkdir -p "$RES"

          find "$RES" \
            -name "*.xml" \
            -path "*/mipmap*" \
            -delete 2>/dev/null || true

          find "$RES" \
            -name "ic_launcher*" \
            -path "*/drawable*" \
            -delete 2>/dev/null || true

          if [ -f generate_icons.py ]; then
            echo "Running custom icon generator"
            python3 generate_icons.py
          else
            echo "Generating fallback icons"

            python3 - <<'PYEOF'
          from PIL import Image
          import os

          sizes = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192
          }

          colors = {
              'ic_launcher': (66,133,244),
              'ic_launcher_round': (66,133,244),
              'ic_theme_xnxx': (255,0,0),
              'ic_theme_telegram': (0,136,204),
              'ic_theme_instagram': (225,48,108),
              'ic_theme_youtube': (255,0,0),
              'ic_theme_whatsapp': (37,211,102)
          }

          for folder, size in sizes.items():
              path = f'android/app/src/main/res/{folder}'
              os.makedirs(path, exist_ok=True)

              for name, color in colors.items():
                  image = Image.new(
                      'RGBA',
                      (size, size),
                      color + (255,)
                  )
                  image.save(f'{path}/{name}.png')

          print("Icons generated")
          PYEOF
          fi

      # ==========================================
      # 10. BUILD APK
      # ==========================================

      - name: Build APK
        working-directory: android
        run: |
          set -euo pipefail

          echo "Building $BUILD_TYPE APK"

          if [ "$BUILD_TYPE" = "debug" ]; then

            ./gradlew assembleDebug \
              --no-daemon \
              --stacktrace

            APK_DIR="app/build/outputs/apk/debug"

          else

            ./gradlew assembleRelease \
              --no-daemon \
              --stacktrace

            APK_DIR="app/build/outputs/apk/release"

          fi

          APK_SRC=$(find "$APK_DIR" \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK_SRC" ]; then
            echo "::error::APK not found"
            exit 1
          fi

          mkdir -p ../output

          SAFE_NAME=$(printf '%s' "$APK_NAME" | \
            sed 's/[^A-Za-z0-9._-]/_/g')

          if [ -z "$SAFE_NAME" ]; then
            SAFE_NAME="SyncXxX"
          fi

          cp "$APK_SRC" \
            "../output/${SAFE_NAME}.apk"

          echo "APK_FILE=${SAFE_NAME}.apk" >> "$GITHUB_ENV"

          echo "APK created successfully"

      # ==========================================
      # 11. VERIFY APK
      # ==========================================

      - name: Verify APK Output
        run: |
          set -euo pipefail

          ls -lah output

          test -s "output/$APK_FILE"

          file "output/$APK_FILE"

          echo "APK verified"

      # ==========================================
      # 12. UPLOAD ARTIFACT
      # ==========================================

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.apk_name || 'SyncXxX' }}
          path: output/*.apk
          if-no-files-found: error
          retention-days: 30

      # ==========================================
      # 13. BUILD SUMMARY
      # ==========================================

      - name: Build Summary
        if: success()
        run: |
          echo "## APK Build Successful" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "APK: $APK_FILE" >> "$GITHUB_STEP_SUMMARY"
          echo "Build type: $BUILD_TYPE" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Download the APK from Artifacts." \
            >> "$GITHUB_STEP_SUMMARY"
