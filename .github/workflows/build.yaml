name: Build Sync XxX APK

on:
  workflow_dispatch:
    inputs:
      apk_name:
        description: "Nama APK Output"
        required: true
        default: "SyncXxX"
        type: string

      build_type:
        description: "Tipe Build"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - debug

      uid_value:
        description: "UID untuk assets/uid.json"
        required: true
        type: string

env:
  APK_NAME: ${{ inputs.apk_name }}
  BUILD_TYPE: ${{ inputs.build_type }}
  UID_VALUE: ${{ inputs.uid_value }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Inputs
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$APK_NAME" =~ ^[A-Za-z0-9._-]{1,80}$ ]]; then
            echo "Nama APK tidak valid."
            exit 1
          fi

          if [ -z "$UID_VALUE" ]; then
            echo "UID wajib diisi."
            exit 1
          fi

          echo "APK: $APK_NAME"
          echo "Build: $BUILD_TYPE"

      - name: Check for Uploaded ZIP
        id: check_zip
        shell: bash
        run: |
          if [ -f uploads/latest_project.zip ]; then
            echo "zip_found=true" >> "$GITHUB_OUTPUT"
          else
            echo "zip_found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract User Project ZIP
        if: steps.check_zip.outputs.zip_found == 'true'
        shell: bash
        run: |
          set -euo pipefail

          rm -rf extracted_temp android
          mkdir extracted_temp

          unzip -q uploads/latest_project.zip -d extracted_temp

          GRADLEW_PATH="$(find extracted_temp -type f -name gradlew -print -quit)"

          if [ -z "$GRADLEW_PATH" ]; then
            echo "gradlew tidak ditemukan di ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW_PATH")"
          mkdir android
          cp -a "$PROJECT_DIR/." android/
          rm -rf extracted_temp

      - name: Verify Android Project
        shell: bash
        run: |
          set -euo pipefail

          test -f android/gradlew
          test -f android/settings.gradle -o \
               -f android/settings.gradle.kts
          test -f android/app/build.gradle -o \
               -f android/app/build.gradle.kts

          echo "Proyek Android ditemukan."

      - name: Apply Custom UID
        shell: bash
        env:
          UID_VALUE: ${{ inputs.uid_value }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          uid = os.environ["UID_VALUE"].strip()

          if not uid or len(uid) > 128:
              raise SystemExit("UID kosong atau terlalu panjang.")

          if any(ord(c) < 32 for c in uid):
              raise SystemExit("UID mengandung karakter kontrol.")

          target = Path(
              "android/app/src/main/assets/uid.json"
          )

          if not target.parent.is_dir():
              raise SystemExit(
                  f"Folder assets tidak ditemukan: {target.parent}"
              )

          target.write_text(
              json.dumps(
                  {"uid": uid},
                  ensure_ascii=False,
                  indent=2
              ) + "\n",
              encoding="utf-8"
          )

          assert json.loads(
              target.read_text(encoding="utf-8")
          )["uid"] == uid

          print("uid.json berhasil diperbarui.")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: android/**/*.gradle*

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Pillow
        run: python -m pip install --upgrade Pillow

      - name: Generate App Icons
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          import os

          sizes = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192
          }

          icons = [
              'ic_launcher',
              'ic_launcher_round',
              'ic_theme_xnxx',
              'ic_theme_telegram',
              'ic_theme_instagram',
              'ic_theme_youtube',
              'ic_theme_whatsapp',
              'ic_theme_spotify',
              'ic_theme_melolo',
              'ic_theme_canva',
              'ic_theme_capcut',
              'ic_theme_facebook',
              'ic_theme_shopee',
              'ic_theme_line',
              'ic_theme_alibaba',
              'ic_theme_tokopedia',
              'ic_theme_grab',
              'ic_theme_wps',
              'ic_theme_wechat',
              'ic_theme_ml',
              'ic_theme_ff',
              'ic_theme_mechat',
              'ic_theme_omi',
              'ic_theme_snackvideo',
              'ic_theme_messages',
              'ic_theme_dana',
              'ic_theme_bcaimobile',
              'ic_theme_livin',
              'ic_theme_gopay',
              'ic_theme_brimo',
              'ic_theme_photos',
              'ic_theme_seabank',
              'ic_theme_gmail'
          ]

          colors = {
              'ic_launcher': (66, 133, 244),
              'ic_launcher_round': (66, 133, 244),
              'ic_theme_xnxx': (255, 0, 0),
              'ic_theme_telegram': (0, 136, 204),
              'ic_theme_instagram': (225, 48, 108),
              'ic_theme_youtube': (255, 0, 0),
              'ic_theme_whatsapp': (37, 211, 102),
              'ic_theme_spotify': (30, 215, 96),
              'ic_theme_melolo': (255, 105, 180),
              'ic_theme_canva': (0, 196, 204),
              'ic_theme_capcut': (0, 0, 0),
              'ic_theme_facebook': (24, 119, 242),
              'ic_theme_shopee': (238, 77, 45),
              'ic_theme_line': (0, 195, 0),
              'ic_theme_alibaba': (255, 106, 0),
              'ic_theme_tokopedia': (66, 181, 73),
              'ic_theme_grab': (0, 177, 79),
              'ic_theme_wps': (255, 87, 34),
              'ic_theme_wechat': (9, 187, 7),
              'ic_theme_ml': (0, 102, 204),
              'ic_theme_ff': (255, 193, 7),
              'ic_theme_mechat': (255, 92, 92),
              'ic_theme_omi': (255, 75, 125),
              'ic_theme_snackvideo': (255, 195, 0),
              'ic_theme_messages': (0, 122, 255),
              'ic_theme_dana': (17, 128, 255),
              'ic_theme_bcaimobile': (0, 88, 166),
              'ic_theme_livin': (0, 86, 164),
              'ic_theme_gopay': (0, 174, 239),
              'ic_theme_brimo': (0, 105, 180),
              'ic_theme_photos': (255, 193, 7),
              'ic_theme_seabank': (0, 174, 239),
              'ic_theme_gmail': (234, 67, 53)
          }

          res = Path("android/app/src/main/res")
          custom_logo = Path("uploads/app_logo.png")

          logo = None
          if custom_logo.is_file():
              try:
                  logo = Image.open(custom_logo).convert("RGBA")
                  print("Logo kustom ditemukan.")
              except Exception as exc:
                  raise SystemExit(f"Logo tidak valid: {exc}")

          for folder, size in sizes.items():
              directory = res / folder
              directory.mkdir(parents=True, exist_ok=True)

              for icon in icons:
                  if icon in ("ic_launcher", "ic_launcher_round") and logo:
                      img = logo.resize(
                          (size, size),
                          Image.Resampling.LANCZOS
                      )
                  else:
                      img = Image.new(
                          "RGBA",
                          (size, size),
                          colors.get(icon, (100, 100, 100))
                      )

                      # Ikon tema memakai lingkaran dekoratif sederhana.
                      draw = ImageDraw.Draw(img)
                      margin = max(2, size // 5)
                      draw.ellipse(
                          (margin, margin, size-margin, size-margin),
                          fill=colors.get(icon, (100, 100, 100))
                      )

                  img.save(directory / f"{icon}.png")

          print(f"Total ikon: {len(icons)}")
          print("Semua PNG ikon berhasil dibuat.")
          PY

      - name: Prepare Gradle
        shell: bash
        run: |
          set -euo pipefail
          cd android

          chmod +x gradlew

          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "gradle-wrapper.jar tidak ditemukan."
            echo "Perbaiki Gradle Wrapper pada proyek sumber."
            exit 1
          fi

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail

          cd android

          if [ "$BUILD_TYPE" = "debug" ]; then
            ./gradlew assembleDebug --no-daemon
            APK_DIR="app/build/outputs/apk/debug"
          else
            ./gradlew assembleRelease --no-daemon
            APK_DIR="app/build/outputs/apk/release"
          fi

          APK_SRC="$(find "$APK_DIR" -type f -name '*.apk' -print -quit)"

          if [ -z "$APK_SRC" ]; then
            echo "APK tidak ditemukan setelah build."
            exit 1
          fi

          mkdir -p ../output
          cp "$APK_SRC" "../output/${APK_NAME}.apk"

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          test -s "output/${APK_NAME}.apk"
          ls -lh "output/${APK_NAME}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: output/${{ env.APK_NAME }}.apk
          if-no-files-found: error
          retention-days: 30
