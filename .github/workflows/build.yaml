
name: Build Sync XxX APK

on:
  workflow_dispatch:
    inputs:
      apk_name:
        description: 'Nama APK Output'
        required: true
        default: 'SyncXxX'
      build_type:
        description: 'Tipe Build'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

env:
  APK_NAME: ${{ github.event.inputs.apk_name || 'SyncXxX' }}
  BUILD_TYPE: ${{ github.event.inputs.build_type || 'release' }}

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Build Inputs
        run: |
          echo "APK Name: $APK_NAME"
          echo "Build Type: $BUILD_TYPE"

      - name: Verify Android Project
        run: |
          if [ ! -d "android" ]; then
            echo "ERROR: Folder android tidak ditemukan!"
            exit 1
          fi

          if [ ! -f "android/gradlew" ]; then
            echo "ERROR: android/gradlew tidak ditemukan!"
            exit 1
          fi

          if [ ! -f "android/app/build.gradle" ] && \
             [ ! -f "android/app/build.gradle.kts" ]; then
            echo "ERROR: Konfigurasi Gradle tidak ditemukan!"
            exit 1
          fi

          echo "Android project ditemukan."
          ls -la android/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow
        run: |
          python -m pip install --upgrade pip
          pip install Pillow

      - name: Fix Gradle Wrapper
        run: |
          cd android

          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Generating Gradle Wrapper..."

            mkdir -p gradle/wrapper

            sudo apt-get update -qq
            sudo apt-get install -y -qq unzip

            curl -fL \
              -o /tmp/gradle-8.4-bin.zip \
              https://services.gradle.org/distributions/gradle-8.4-bin.zip

            unzip -q /tmp/gradle-8.4-bin.zip -d /tmp/

            /tmp/gradle-8.4/bin/gradle wrapper \
              --gradle-version 8.4

            rm -rf /tmp/gradle-8.4 /tmp/gradle-8.4-bin.zip
          fi

          if [ ! -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            mkdir -p gradle/wrapper

            printf '%s\n' \
              'distributionBase=GRADLE_USER_HOME' \
              'distributionPath=wrapper/dists' \
              'distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip' \
              'networkTimeout=10000' \
              'validateDistributionUrl=true' \
              'zipStoreBase=GRADLE_USER_HOME' \
              'zipStorePath=wrapper/dists' \
              > gradle/wrapper/gradle-wrapper.properties
          fi

          chmod +x gradlew
          echo "Gradle Wrapper siap."

      # Gunakan sync.jpg sebagai sumber ikon launcher.
      # File JPG asli tidak dihapus atau diubah.
      - name: Generate Launcher Icons
        run: |
          python3 - <<'PY'
          import os
          from PIL import Image

          candidates = [
              "sync.jpg",
              "sync.jpeg",
              "android/sync.jpg",
              "android/app/sync.jpg",
              "android/app/src/main/res/drawable/sync.jpg",
              "android/app/src/main/res/drawable-nodpi/sync.jpg"
          ]

          source = next(
              (p for p in candidates if os.path.isfile(p)),
              None
          )

          if not source:
              for folder, _, files in os.walk("."):
                  if ".git" in folder.split(os.sep):
                      continue

                  for filename in files:
                      if filename.lower() == "sync.jpg":
                          source = os.path.join(folder, filename)
                          break

                  if source:
                      break

          if not source:
              raise SystemExit("ERROR: sync.jpg tidak ditemukan!")

          print("Sumber ikon:", source)

          base = "android/app/src/main/res"

          densities = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192
          }

          with Image.open(source) as original:
              image = original.convert("RGB")

              for folder, size in densities.items():
                  output_dir = os.path.join(base, folder)
                  os.makedirs(output_dir, exist_ok=True)

                  resized = image.resize(
                      (size, size),
                      Image.Resampling.LANCZOS
                  )

                  for name in [
                      "ic_launcher",
                      "ic_launcher_round"
                  ]:
                      target = os.path.join(
                          output_dir,
                          name + ".jpg"
                      )

                      resized.save(target, format="jpg")
                      print("Dibuat:", target)

          print("Launcher icons selesai dibuat.")
          print("JPG sumber tetap dipertahankan.")
          PY

      - name: Verify Launcher Icons
        run: |
          set -e

          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            for icon in ic_launcher ic_launcher_round; do
              FILE="android/app/src/main/res/mipmap-${density}/${icon}.jpg"

              if [ ! -s "$FILE" ]; then
                echo "ERROR: $FILE tidak ditemukan!"
                exit 1
              fi
            done
          done

          echo "Semua ikon launcher tersedia."

      - name: Build APK
        run: |
          set -e

          cd android

          echo "Building $BUILD_TYPE APK..."

          if [ "$BUILD_TYPE" = "debug" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace

            APK_SRC=$(find app/build/outputs/apk/debug/ \
              -name "*.apk" | head -1)
          else
            ./gradlew assembleRelease --no-daemon --stacktrace

            APK_SRC=$(find app/build/outputs/apk/release/ \
              -name "*.apk" | head -1)
          fi

          if [ -z "$APK_SRC" ]; then
            echo "ERROR: APK tidak ditemukan!"
            find app/build/outputs/ -name "*.apk" || true
            exit 1
          fi

          mkdir -p ../output

          cp "$APK_SRC" "../output/${APK_NAME}.apk"

          echo "APK berhasil disiapkan."

      - name: Verify Output
        run: |
          if [ ! -s "output/${APK_NAME}.apk" ]; then
            echo "ERROR: APK tidak ditemukan atau kosong!"
            exit 1
          fi

          ls -lh "output/${APK_NAME}.apk"
          echo "APK siap diunduh."

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: output/${{ env.APK_NAME }}.apk
          retention-days: 30
