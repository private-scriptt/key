
name: Build Sync XxX APK

on:
  workflow_dispatch:
    inputs:
      apk_name:
        description: 'Nama APK Output'
        required: true
        default: 'SyncXxX'
      build_type:
        description: 'Tipe Build'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

env:
  APK_NAME: ${{ github.event.inputs.apk_name || 'SyncXxX' }}
  BUILD_TYPE: ${{ github.event.inputs.build_type || 'release' }}

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: write

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Tampilkan konfigurasi
      - name: Show Build Inputs
        run: |
          echo "APK Name: $APK_NAME"
          echo "Build Type: $BUILD_TYPE"

      # 3. Pastikan project sudah di-upload oleh bot
      - name: Verify Android Project
        run: |
          if [ ! -d "android" ]; then
            echo "ERROR: Folder android tidak ditemukan!"
            exit 1
          fi

          if [ ! -f "android/gradlew" ]; then
            echo "ERROR: android/gradlew tidak ditemukan!"
            exit 1
          fi

          if [ ! -f "android/app/build.gradle" ] && \
             [ ! -f "android/app/build.gradle.kts" ]; then
            echo "ERROR: File konfigurasi app Gradle tidak ditemukan!"
            exit 1
          fi

          echo "Android project ditemukan."
          ls -la android/

      # 4. Siapkan Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 5. Siapkan Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 6. Install Pillow
      - name: Install Pillow
        run: |
          python -m pip install --upgrade pip
          pip install Pillow

      # 7. Siapkan Gradle Wrapper
      - name: Fix Gradle Wrapper
        run: |
          cd android

          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Generating Gradle Wrapper..."

            mkdir -p gradle/wrapper

            sudo apt-get update -qq
            sudo apt-get install -y -qq unzip

            curl -fL \
              -o /tmp/gradle-8.4-bin.zip \
              https://services.gradle.org/distributions/gradle-8.4-bin.zip

            unzip -q /tmp/gradle-8.4-bin.zip -d /tmp/

            /tmp/gradle-8.4/bin/gradle wrapper \
              --gradle-version 8.4

            rm -rf /tmp/gradle-8.4 /tmp/gradle-8.4-bin.zip
          fi

          if [ ! -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            mkdir -p gradle/wrapper

            printf '%s\n' \
              'distributionBase=GRADLE_USER_HOME' \
              'distributionPath=wrapper/dists' \
              'distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip' \
              'networkTimeout=10000' \
              'validateDistributionUrl=true' \
              'zipStoreBase=GRADLE_USER_HOME' \
              'zipStorePath=wrapper/dists' \
              > gradle/wrapper/gradle-wrapper.properties
          fi

          chmod +x gradlew
          echo "Gradle Wrapper siap."

      # 8. Generate ikon dari script project jika tersedia
      - name: Generate App Icons
        run: |
          if [ -f "generate_icons.py" ]; then
            echo "Menjalankan generate_icons.py..."
            python generate_icons.py
          else
            echo "generate_icons.py tidak ditemukan."
            echo "Melanjutkan pemeriksaan ikon otomatis."
          fi

      # 9. Buat resource ikon yang benar-benar belum tersedia
      - name: Verify and Repair Missing Icons
        run: |
          python3 - <<'PY'
          import os
          import re
          from PIL import Image, ImageDraw

          base = "android/app/src/main/res"
          manifest = "android/app/src/main/AndroidManifest.xml"

          densities = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192
          }

          if not os.path.isfile(manifest):
              raise SystemExit("AndroidManifest.xml tidak ditemukan!")

          with open(manifest, "r", encoding="utf-8") as f:
              content = f.read()

          # Ambil semua referensi mipmap dari Manifest
          names = sorted(set(re.findall(
              r"@mipmap/([a-zA-Z0-9_]+)",
              content
          )))

          print("Resource mipmap ditemukan:", len(names))

          if not names:
              raise SystemExit("Tidak ada referensi mipmap di Manifest!")

          def placeholder(size, name):
              img = Image.new(
                  "RGBA",
                  (size, size),
                  (8, 12, 16, 255)
              )

              draw = ImageDraw.Draw(img)
              draw.ellipse(
                  [
                      size // 4,
                      size // 4,
                      size * 3 // 4,
                      size * 3 // 4
                  ],
                  fill=(0, 212, 255, 255)
              )

              return img

          created = 0
          existing = 0

          for folder, size in densities.items():
              out_dir = os.path.join(base, folder)
              os.makedirs(out_dir, exist_ok=True)

              for name in names:
                  target = os.path.join(
                      out_dir,
                      name + ".png"
                  )

                  if os.path.isfile(target):
                      existing += 1
                      continue

                  img = placeholder(size, name)
                  img.save(target, "PNG")

                  print("Dibuat:", target)
                  created += 1

          print("Ikon sudah tersedia:", existing)
          print("Placeholder dibuat:", created)
          print("Pemeriksaan ikon selesai.")
          PY

      # 10. Pastikan semua referensi mipmap tersedia
      - name: Final Icon Check
        run: |
          python3 - <<'PY'
          import os
          import re

          manifest = "android/app/src/main/AndroidManifest.xml"
          base = "android/app/src/main/res"

          with open(manifest, encoding="utf-8") as f:
              content = f.read()

          names = set(re.findall(
              r"@mipmap/([a-zA-Z0-9_]+)",
              content
          ))

          densities = [
              "mipmap-mdpi",
              "mipmap-hdpi",
              "mipmap-xhdpi",
              "mipmap-xxhdpi",
              "mipmap-xxxhdpi"
          ]

          missing = []

          for name in sorted(names):
              for density in densities:
                  path = os.path.join(
                      base,
                      density,
                      name + ".png"
                  )

                  if not os.path.isfile(path):
                      missing.append(path)

          if missing:
              print("Resource masih hilang:")
              for item in missing:
                  print(item)
              raise SystemExit(1)

          print("Semua referensi mipmap memiliki PNG.")
          PY

      # 11. Build APK
      - name: Build APK
        run: |
          set -e

          cd android

          echo "Building $BUILD_TYPE APK..."

          if [ "$BUILD_TYPE" = "debug" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace

            APK_SRC=$(find app/build/outputs/apk/debug/ \
              -name "*.apk" | head -1)
          else
            ./gradlew assembleRelease --no-daemon --stacktrace

            APK_SRC=$(find app/build/outputs/apk/release/ \
              -name "*.apk" | head -1)
          fi

          if [ -z "$APK_SRC" ]; then
            echo "ERROR: APK tidak ditemukan!"

            find app/build/outputs/ \
              -name "*.apk" 2>/dev/null || true

            exit 1
          fi

          echo "APK ditemukan: $APK_SRC"

          mkdir -p ../output

          cp "$APK_SRC" "../output/${APK_NAME}.apk"

          echo "APK berhasil disiapkan."

      # 12. Verifikasi APK
      - name: Verify Output
        run: |
          if [ ! -s "output/${APK_NAME}.apk" ]; then
            echo "ERROR: APK tidak ditemukan atau kosong!"
            exit 1
          fi

          ls -lh "output/${APK_NAME}.apk"

          echo "APK siap diunduh."

      # 13. Upload Artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: output/${{ env.APK_NAME }}.apk
          retention-days: 30
