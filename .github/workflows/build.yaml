

name: Build Sync XxX APK

on:
  workflow_dispatch:
    inputs:
      apk_name:
        description: 'Nama APK Output'
        required: true
        default: 'SyncXxX'
      build_type:
        description: 'Tipe Build'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

env:
  APK_NAME: ${{ inputs.apk_name || 'SyncXxX' }}
  BUILD_TYPE: ${{ inputs.build_type || 'release' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read

    steps:
      # ========================================
      # 1. CHECKOUT + GIT LFS
      # ========================================

      - name: Checkout Repository with Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: true

      - name: Ensure Git LFS Files Downloaded
        run: |
          set -e
          git lfs install
          git lfs pull
          echo "✅ Git LFS download completed"

      - name: Show Build Inputs
        run: |
          echo "📦 APK Name: $APK_NAME"
          echo "🔧 Build Type: $BUILD_TYPE"

      # ========================================
      # 2. CHECK ZIP
      # ========================================

      - name: Check for Uploaded ZIP
        id: check_zip
        run: |
          if [ -f "uploads/latest_project.zip" ]; then
            echo "zip_found=true" >> "$GITHUB_OUTPUT"
            echo "📦 ZIP found"
          else
            echo "zip_found=false" >> "$GITHUB_OUTPUT"
            echo "📁 Using existing android/ project"
          fi

      - name: Verify ZIP Integrity
        if: steps.check_zip.outputs.zip_found == 'true'
        run: |
          set -e

          ZIP="uploads/latest_project.zip"

          echo "📦 ZIP information:"
          ls -lh "$ZIP"
          file "$ZIP"

          if grep -a -q -m 1 \
            'https://git-lfs.github.com/spec/v1' \
            "$ZIP"; then
            echo "❌ Git LFS pointer detected!"
            echo "ZIP content was not downloaded."
            exit 1
          fi

          echo "🔍 Testing ZIP integrity..."
          unzip -tq "$ZIP"

          echo "✅ ZIP is valid"

      # ========================================
      # 3. EXTRACT AND LOCATE ANDROID PROJECT
      # ========================================

      - name: Extract User Project ZIP
        if: steps.check_zip.outputs.zip_found == 'true'
        run: |
          set -euo pipefail

          echo "📦 Extracting user project..."

          rm -rf extracted_temp
          mkdir -p extracted_temp

          unzip -q \
            uploads/latest_project.zip \
            -d extracted_temp/

          echo "📁 Extracted contents:"
          ls -lah extracted_temp/

          GRADLEW_PATH=$(find extracted_temp \
            -type f \
            -name "gradlew" \
            -print -quit)

          if [ -z "$GRADLEW_PATH" ]; then
            echo "❌ gradlew not found in ZIP!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW_PATH")

          echo "📁 Android project found:"
          echo "$PROJECT_DIR"

          # Preserve root assets and scripts if present.
          if [ "$PROJECT_DIR" != "extracted_temp" ]; then
            find extracted_temp \
              -maxdepth 1 \
              -type f \
              -exec cp {} ./ \;
          fi

          if [ "$PROJECT_DIR" = "extracted_temp" ]; then
            rm -rf android
            mkdir -p android
            cp -a extracted_temp/. android/
          else
            rm -rf android
            cp -a "$PROJECT_DIR" android/
          fi

          rm -rf extracted_temp

          echo "📁 Final Android structure:"
          ls -lah android/

      # ========================================
      # 4. VERIFY ANDROID PROJECT
      # ========================================

      - name: Verify Android Project
        run: |
          set -e

          if [ ! -f "android/gradlew" ]; then
            echo "❌ android/gradlew not found"
            exit 1
          fi

          if [ ! -f "android/settings.gradle" ] && \
             [ ! -f "android/settings.gradle.kts" ]; then
            echo "❌ Gradle settings file missing"
            exit 1
          fi

          if [ ! -d "android/app" ]; then
            echo "❌ Android app module missing"
            exit 1
          fi

          chmod +x android/gradlew

          echo "✅ Android project verified"

      # ========================================
      # 5. JAVA AND ANDROID SDK
      # ========================================

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle
            android/**/*.gradle.kts
            android/**/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ========================================
      # 6. GRADLE WRAPPER
      # ========================================

      - name: Fix Gradle Wrapper
        working-directory: android
        run: |
          set -e

          chmod +x gradlew

          if [ ! -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "❌ Wrapper properties missing"
            exit 1
          fi

          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "📥 Wrapper JAR missing"
            echo "Installing Gradle to regenerate it..."

            GRADLE_VERSION=8.4

            curl -fL --retry 3 \
              -o /tmp/gradle.zip \
              "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"

            unzip -q /tmp/gradle.zip -d /tmp

            /tmp/gradle-${GRADLE_VERSION}/bin/gradle \
              wrapper \
              --gradle-version "${GRADLE_VERSION}"

            rm -rf \
              /tmp/gradle.zip \
              /tmp/gradle-${GRADLE_VERSION}
          fi

          chmod +x gradlew

          echo "✅ Gradle wrapper ready"

      # ========================================
      # 7. PYTHON + PILLOW
      # ========================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow
        run: |
          python -m pip install --upgrade pip
          python -m pip install Pillow

      # ========================================
      # 8. GENERATE APP ICONS
      # ========================================

      - name: Generate App Icons
        run: |
          set -e

          RES="android/app/src/main/res"

          mkdir -p "$RES"

          echo "🎨 Preparing icons..."

          find "$RES" \
            -path "*/mipmap*/*.xml" \
            -delete 2>/dev/null || true

          find "$RES" \
            -path "*/drawable*/ic_launcher*" \
            -delete 2>/dev/null || true

          if [ -f "generate_icons.py" ]; then

            echo "🎨 Running generate_icons.py"
            python3 generate_icons.py

          else

            echo "⚠️ Custom icon generator missing"
            echo "🎨 Generating fallback icons"

            python3 - <<'PYEOF'
          from PIL import Image
          import os

          sizes = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192
          }

          colors = {
              'ic_launcher': (66, 133, 244),
              'ic_launcher_round': (66, 133, 244),
              'ic_theme_xnxx': (255, 0, 0),
              'ic_theme_telegram': (0, 136, 204),
              'ic_theme_instagram': (225, 48, 108),
              'ic_theme_youtube': (255, 0, 0),
              'ic_theme_whatsapp': (37, 211, 102)
          }

          for folder, size in sizes.items():
              path = f'android/app/src/main/res/{folder}'
              os.makedirs(path, exist_ok=True)

              for name, color in colors.items():
                  image = Image.new(
                      'RGBA',
                      (size, size),
                      color + (255,)
                  )
                  image.save(f'{path}/{name}.png')

          print("✅ Fallback icons generated")
          PYEOF

          fi

          echo "✅ Icon preparation complete"

      # ========================================
      # 9. BUILD APK
      # ========================================

      - name: Build APK
        working-directory: android
        run: |
          set -euo pipefail

          echo "🔨 Building $BUILD_TYPE APK..."

          if [ "$BUILD_TYPE" = "debug" ]; then
            ./gradlew assembleDebug \
              --no-daemon \
              --stacktrace

            APK_DIR="app/build/outputs/apk/debug"
          else
            ./gradlew assembleRelease \
              --no-daemon \
              --stacktrace

            APK_DIR="app/build/outputs/apk/release"
          fi

          APK_SRC=$(find "$APK_DIR" \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK_SRC" ]; then
            echo "❌ APK not found!"
            exit 1
          fi

          echo "📦 APK found: $APK_SRC"

          mkdir -p ../output

          SAFE_NAME=$(printf '%s' "$APK_NAME" | \
            sed 's/[^A-Za-z0-9._-]/_/g')

          if [ -z "$SAFE_NAME" ]; then
            SAFE_NAME="SyncXxX"
          fi

          cp "$APK_SRC" \
            "../output/${SAFE_NAME}.apk"

          echo "APK_FILE=${SAFE_NAME}.apk" >> "$GITHUB_ENV"

          echo "✅ APK copied successfully"

      # ========================================
      # 10. VERIFY OUTPUT
      # ========================================

      - name: Verify APK Output
        run: |
          set -e

          echo "📂 APK output:"
          ls -lah output/

          test -s "output/$APK_FILE"

          file "output/$APK_FILE"

          echo "✅ APK output verified"

      # ========================================
      # 11. UPLOAD APK ARTIFACT
      # ========================================

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.apk_name || 'SyncXxX' }}
          path: output/*.apk
          if-no-files-found: error
          retention-days: 30

      # ========================================
      # 12. BUILD SUMMARY
      # ========================================

      - name: Build Summary
        if: success()
        run: |
          echo "## ✅ APK Build Successful" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK: $APK_FILE" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build type: $BUILD_TYPE" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source: uploads/latest_project.zip or android/" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Download APK from workflow artifacts." >> "$GITHUB_STEP_SUMMARY"
