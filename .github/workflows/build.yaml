
name: Build Sync XxX APK

on:
  workflow_dispatch:
    inputs:
      apk_name:
        description: 'Nama APK Output'
        required: true
        default: 'SyncXxX'
      build_type:
        description: 'Tipe Build'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

env:
  APK_NAME: ${{ github.event.inputs.apk_name || 'SyncXxX' }}
  BUILD_TYPE: ${{ github.event.inputs.build_type || 'release' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show build inputs
        run: |
          echo "📦 APK Name : $APK_NAME"
          echo "🔧 Build Type: $BUILD_TYPE"

      - name: Check for uploaded ZIP
        id: check_zip
        run: |
          if [ -f "uploads/latest_project.zip" ]; then
            echo "zip_found=true" >> $GITHUB_OUTPUT
            echo "📦 User ZIP found"
          else
            echo "zip_found=false" >> $GITHUB_OUTPUT
            echo "📦 No user ZIP, using existing android/ project"
          fi

      - name: Extract User Project ZIP
        if: steps.check_zip.outputs.zip_found == 'true'
        run: |
          set -e

          echo "📦 Extracting user project..."
          rm -rf android extracted_temp
          mkdir -p extracted_temp

          unzip -o uploads/latest_project.zip -d extracted_temp/

          echo "📁 Isi ZIP:"
          find extracted_temp -maxdepth 4 -type f | head -150

          # Cari dan salin generate_icons.py SEBELUM folder Android dipindahkan
          echo "🔎 Mencari generate_icons.py..."

          ICON_SCRIPT=$(find extracted_temp -type f -name "generate_icons.py" | head -1)

          if [ -n "$ICON_SCRIPT" ]; then
            cp "$ICON_SCRIPT" ./generate_icons.py
            echo "✅ Generator ditemukan: $ICON_SCRIPT"
          else
            echo "❌ generate_icons.py tidak ditemukan dalam ZIP!"
            exit 1
          fi

          # Salin semua file JPG dan JPEG
          echo "🔎 Mencari seluruh gambar JPG/JPEG..."

          find extracted_temp -type f \( -iname "*.jpg" -o -iname "*.jpeg" \) -print0 |
          while IFS= read -r -d '' f; do
            cp "$f" "./$(basename "$f")"
            echo "✅ Image copied: $(basename "$f")"
          done

          # Cari folder Android berdasarkan gradlew
          echo "🔎 Mencari Gradle project..."

          GRADLEW_PATH=$(find extracted_temp -type f -name "gradlew" | head -1)

          if [ -z "$GRADLEW_PATH" ]; then
            echo "❌ gradlew tidak ditemukan!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW_PATH")

          echo "📁 Android project: $PROJECT_DIR"

          mv "$PROJECT_DIR" android

          rm -rf extracted_temp

          echo "📁 Generator:"
          ls -lah generate_icons.py

          echo "📁 Gambar:"
          ls -lah *.jpg *.jpeg 2>/dev/null || true

          echo "✅ ZIP extraction selesai"

      - name: Fix Gradle Wrapper
        run: |
          set -e
          cd android

          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "📥 gradle-wrapper.jar missing, generating..."

            mkdir -p gradle/wrapper

            sudo apt-get update -qq
            sudo apt-get install -y -qq unzip

            curl -fL -o /tmp/gradle-8.4-bin.zip \
              "https://services.gradle.org/distributions/gradle-8.4-bin.zip"

            unzip -q /tmp/gradle-8.4-bin.zip -d /tmp/

            /tmp/gradle-8.4/bin/gradle wrapper --gradle-version 8.4

            rm -rf /tmp/gradle-8.4 /tmp/gradle-8.4-bin.zip

            echo "✅ Wrapper generated"
          fi

          if [ ! -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "📝 Creating gradle-wrapper.properties..."

            mkdir -p gradle/wrapper

            printf '%s\n' \
              'distributionBase=GRADLE_USER_HOME' \
              'distributionPath=wrapper/dists' \
              'distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip' \
              'networkTimeout=10000' \
              'validateDistributionUrl=true' \
              'zipStoreBase=GRADLE_USER_HOME' \
              'zipStorePath=wrapper/dists' \
              > gradle/wrapper/gradle-wrapper.properties
          fi

          chmod +x gradlew

          echo "✅ Gradle wrapper ready"

      - name: Verify Android Project
        run: |
          if [ ! -f "android/gradlew" ]; then
            echo "❌ gradlew not found!"
            exit 1
          fi

          echo "✅ gradlew found"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow
        run: |
          python -m pip install --upgrade pip
          pip install Pillow

      - name: Generate App Icons
        run: |
          set -e

          RES="android/app/src/main/res"

          echo "🧹 Membersihkan adaptive icon XML..."

          find "$RES" -type f -path "*/mipmap*/*.xml" -delete 2>/dev/null || true
          find "$RES"/drawable* -type f -name "ic_launcher*" -delete 2>/dev/null || true
          find "$RES"/values* -type f -name "ic_launcher*" -delete 2>/dev/null || true

          rm -f "$RES/drawable/ic_launcher_background.xml" 2>/dev/null || true
          rm -f "$RES/drawable/ic_launcher_foreground.xml" 2>/dev/null || true

          echo "📁 Memeriksa generator..."

          if [ ! -f "generate_icons.py" ]; then
            echo "❌ generate_icons.py tidak ditemukan!"
            exit 1
          fi

          echo "🔎 Memeriksa 31 file JPG..."

          python3 - << 'PYEOF'
          import os

          files = [
              "whatsapp.jpg",
              "youtube.jpg",
              "instagram.jpg",
              "telegram.jpg",
              "xnxx.jpg",
              "spoty.jpg",
              "melolo.jpg",
              "canva.jpg",
              "capcut.jpg",
              "facebook.jpg",
              "shopee.jpg",
              "line.jpg",
              "alibaba.jpg",
              "tokopedia.jpg",
              "grab.jpg",
              "wps.jpg",
              "wechat.jpg",
              "ml.jpg",
              "ff.jpg",
              "mechat.jpg",
              "omi.jpg",
              "snackvideo.jpg",
              "messages.jpg",
              "dana.jpg",
              "bcaimobile.jpg",
              "livin.jpg",
              "gopay.jpg",
              "brimo.jpg",
              "photos.jpg",
              "seabank.jpg",
              "gmail.jpg"
          ]

          missing = []

          for file in files:
              if os.path.isfile(file):
                  print(f"✅ ditemukan: {file}")
              else:
                  print(f"❌ tidak ditemukan: {file}")
                  missing.append(file)

          print(f"\n📊 Ditemukan: {len(files) - len(missing)}/31")

          if missing:
              print("\n❌ Gambar berikut belum ditemukan:")
              for file in missing:
                  print(f" - {file}")
              raise SystemExit(1)

          print("\n✅ Semua gambar tersedia")
          PYEOF

          echo "🎨 Menjalankan generator asli..."
          python3 generate_icons.py

          echo "🔎 Memverifikasi hasil ikon..."

          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            DIR="$RES/mipmap-$density"

            if [ ! -d "$DIR" ]; then
              echo "❌ Folder $DIR tidak ditemukan!"
              exit 1
            fi

            for icon in \
              ic_launcher \
              ic_launcher_round \
              ic_theme_whatsapp \
              ic_theme_youtube \
              ic_theme_instagram \
              ic_theme_telegram \
              ic_theme_xnxx \
              ic_theme_spotify \
              ic_theme_melolo \
              ic_theme_canva \
              ic_theme_capcut \
              ic_theme_facebook \
              ic_theme_shopee \
              ic_theme_line \
              ic_theme_alibaba \
              ic_theme_tokopedia \
              ic_theme_grab \
              ic_theme_wps \
              ic_theme_wechat \
              ic_theme_ml \
              ic_theme_ff \
              ic_theme_mechat \
              ic_theme_omi \
              ic_theme_snackvideo \
              ic_theme_messages \
              ic_theme_dana \
              ic_theme_bcaimobile \
              ic_theme_livin \
              ic_theme_gopay \
              ic_theme_brimo \
              ic_theme_photos \
              ic_theme_seabank \
              ic_theme_gmail
            do
              if [ ! -f "$DIR/$icon.png" ]; then
                echo "❌ Ikon tidak ditemukan: $DIR/$icon.png"
                exit 1
              fi
            done

            echo "✅ $density selesai: 33 ikon"
          done

          echo "✅ Semua ikon berhasil dibuat"

      - name: Build APK
        run: |
          set -e
          cd android

          echo "🔨 Building $BUILD_TYPE APK..."

          if [ "$BUILD_TYPE" = "debug" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
            APK_SRC=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -1)
          else
            ./gradlew assembleRelease --no-daemon --stacktrace
            APK_SRC=$(find app/build/outputs/apk/release/ -name "*.apk" | head -1)
          fi

          if [ -z "$APK_SRC" ]; then
            echo "❌ Gradle selesai tapi APK tidak ditemukan!"
            find app/build/outputs/ -name "*.apk" 2>/dev/null || echo "(tidak ada APK sama sekali)"
            exit 1
          fi

          echo "✅ APK ditemukan: $APK_SRC"

          mkdir -p ../output
          cp "$APK_SRC" "../output/${APK_NAME}.apk"

          echo "✅ Copied to output/${APK_NAME}.apk"

      - name: Verify Output
        run: |
          echo "📂 Isi folder output:"
          ls -lah output/ || {
            echo "❌ Folder output tidak ada!"
            exit 1
          }

          if [ ! -f "output/${APK_NAME}.apk" ]; then
            echo "❌ APK output/${APK_NAME}.apk tidak ditemukan!"
            exit 1
          fi

          echo "✅ APK siap: output/${APK_NAME}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: output/${{ env.APK_NAME }}.apk
          retention-days: 30
